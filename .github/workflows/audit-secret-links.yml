name: Audit Secret Places links

on:
  push:
    paths:
      - ".github/workflows/audit-secret-links.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check external links
        shell: python
        run: |
          from pathlib import Path
          from urllib.parse import urlparse
          import concurrent.futures, re, urllib.request, urllib.error

          pages = [
            "secret-places-68ddfcf2e6251c2519a02b29.html",
            "research-notes-68ddfcf2e6251c2519a02b29.html",
            "interaction-precedents-68ddfcf2e6251c2519a02b29.html",
            "a-exam-talk-68ddfcf2e6251c2519a02b29.html",
            "brainstorming.html",
            "decision-grounding-axis-notes.html",
          ]
          urls=set()
          for page in pages:
            text=Path(page).read_text()
            urls.update(re.findall(r'href=["\'](https?://[^"\']+)["\']', text))
          print("URL_COUNT",len(urls))

          def check(url):
            req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 SecretPlacesLinkAudit/1.0"})
            try:
              with urllib.request.urlopen(req,timeout=12) as r:
                return url, r.status, r.geturl()
            except urllib.error.HTTPError as e:
              return url, e.code, ""
            except Exception as e:
              return url, "ERR:"+type(e).__name__, ""

          bad=[]
          blocked=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as ex:
            for url,status,final in ex.map(check,sorted(urls)):
              if status in (404,410):
                bad.append((url,status))
              elif status in (401,403,405,406,429,451) or isinstance(status,str):
                blocked.append((url,status))
          print("BROKEN_COUNT",len(bad))
          for x in bad: print("BROKEN",*x)
          print("BOT_OR_NETWORK_COUNT",len(blocked))
          for x in blocked[:40]: print("BOT_OR_NETWORK",*x)
