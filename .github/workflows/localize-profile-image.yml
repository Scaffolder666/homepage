name: Localize profile image

on:
  push:
    paths:
      - ".github/workflows/localize-profile-image.yml"

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download profile image
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "https://matteroftechlab.org/images/people/shuofeng.jpg" -o images/shuo-feng.jpg
          test -s images/shuo-feng.jpg
      - name: Point homepage to local profile image
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          text = p.read_text()
          text = text.replace("https://matteroftechlab.org/images/people/shuofeng.jpg", "images/shuo-feng.jpg")
          p.write_text(text)
      - name: Commit localized profile image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/shuo-feng.jpg index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Localize profile image"
          git push
