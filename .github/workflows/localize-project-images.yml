name: Localize project images
# one-time asset localization

on:
  push:
    paths:
      - ".github/workflows/localize-project-images.yml"

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download project cover images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images
          curl -fL --retry 3 --retry-delay 2 "https://matteroftechlab.org/projects/2026-shuo-cameleon/img/figure1-1.png" -o images/cameleon-cover.png
          curl -fL --retry 3 --retry-delay 2 "https://matteroftechlab.org/projects/2024-shuo-y-ar/img/figure%20one-1.png" -o images/y-ar-cover.png
          curl -fL --retry 3 --retry-delay 2 "https://matteroftechlab.org/projects/2025-zekun-oristitch/figure-one.jpg" -o images/oristitch-cover.jpg
          test -s images/cameleon-cover.png
          test -s images/y-ar-cover.png
          test -s images/oristitch-cover.jpg
          file images/cameleon-cover.png images/y-ar-cover.png images/oristitch-cover.jpg
      - name: Point site to local images
        shell: python
        run: |
          from pathlib import Path
          replacements = {
              "https://matteroftechlab.org/projects/2026-shuo-cameleon/img/figure1-1.png": "images/cameleon-cover.png",
              "https://matteroftechlab.org/projects/2024-shuo-y-ar/img/figure%20one-1.png": "images/y-ar-cover.png",
              "https://matteroftechlab.org/projects/2025-zekun-oristitch/figure-one.jpg": "images/oristitch-cover.jpg",
          }
          for name in ["index.html", "cameleon.html"]:
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text()
              for old, new in replacements.items():
                  text = text.replace(old, new)
              p.write_text(text)
      - name: Commit localized assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/cameleon-cover.png images/y-ar-cover.png images/oristitch-cover.jpg index.html cameleon.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Localize project cover images"
          git push
