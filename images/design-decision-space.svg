<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title description">
  <title id="title">Epistemic states of design decisions</title>
  <desc id="description">Four quadrants describe known unknowns, known knowns, unknown unknowns, and unknown knowns. CAMeleon and FuzzyCAD are core projects in known unknowns. aCADemy is a core project in unknown unknowns. TOM Search and Design with Myself appear as lighter related work in known unknowns and unknown knowns.</desc>
  <rect width="1000" height="720" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#17202a">
    <text x="500" y="44" text-anchor="middle" font-size="30" font-weight="700">Epistemic States of Design Decisions</text>

    <rect x="155" y="96" width="345" height="245" fill="#ffffff" stroke="#17202a" stroke-width="2"/>
    <rect x="500" y="96" width="345" height="245" fill="#f7f7f5" stroke="#17202a" stroke-width="2"/>
    <rect x="155" y="341" width="345" height="245" fill="#ffffff" stroke="#17202a" stroke-width="2"/>
    <rect x="500" y="341" width="345" height="245" fill="#fafafa" stroke="#17202a" stroke-width="2"/>

    <g font-size="25" font-weight="700">
      <text x="180" y="136">Known Unknowns</text>
      <text x="525" y="136">Known Knowns</text>
      <text x="180" y="381">Unknown Unknowns</text>
      <text x="525" y="381">Unknown Knowns</text>
    </g>

    <g font-size="17" fill="#5b6570">
      <text x="180" y="168">I know what I don't know.</text>
      <text x="525" y="168">I know what I know.</text>
      <text x="180" y="413">I don't know what I don't know.</text>
      <text x="525" y="413">I don't know what I know.</text>
    </g>

    <g>
      <circle cx="205" cy="229" r="18" fill="#ffe3a4" stroke="#df9c2c" stroke-width="2"/>
      <text x="235" y="237" font-size="21" font-weight="700">CAMeleon</text>
      <circle cx="205" cy="282" r="18" fill="#ffd5dc" stroke="#e16d7e" stroke-width="2"/>
      <text x="235" y="290" font-size="21" font-weight="700">FuzzyCAD</text>

      <circle cx="205" cy="488" r="18" fill="#c8e4f7" stroke="#3585c5" stroke-width="2"/>
      <text x="235" y="496" font-size="21" font-weight="700">aCADemy</text>
    </g>

    <g fill="none" stroke="#8b949c" stroke-width="2" stroke-dasharray="5 4">
      <circle cx="395" cy="253" r="14"/>
      <circle cx="610" cy="492" r="14"/>
    </g>
    <g fill="#717a82" font-size="15" font-weight="600">
      <text x="395" y="220" text-anchor="middle">TOM Search</text>
      <text x="610" y="522" text-anchor="middle">Design with Myself</text>
      <text x="672" y="255" text-anchor="middle">Automation</text>
    </g>

    <g stroke="#17202a" stroke-width="2" fill="none">
      <path d="M155 628 H845"/>
      <path d="M155 628 l13 -7 v14 z M845 628 l-13 -7 v14 z" fill="#17202a" stroke="none"/>
      <path d="M115 586 V96"/>
      <path d="M115 96 l-7 13 h14 z M115 586 l-7 -13 h14 z" fill="#17202a" stroke="none"/>
    </g>

    <g fill="#17202a" font-weight="700">
      <text x="155" y="661" font-size="15">Knowledge not available</text>
      <text x="845" y="661" text-anchor="end" font-size="15">Knowledge available</text>
      <text x="500" y="690" text-anchor="middle" font-size="14" fill="#59636d">Relevant knowledge / evidence / experience / expertise</text>
      <text x="95" y="112" text-anchor="end" font-size="15" transform="rotate(-90 95 112)">Aware</text>
      <text x="95" y="572" text-anchor="start" font-size="15" transform="rotate(-90 95 572)">Not aware</text>
      <text x="60" y="341" text-anchor="middle" font-size="14" fill="#59636d" transform="rotate(-90 60 341)">Awareness of the knowledge state</text>
    </g>
  </g>
</svg>