<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 770" role="img" aria-labelledby="title description">
  <title id="title">Design Decision Support Space</title>
  <desc id="description">A conceptual two-by-two decision support matrix. Horizontal axis: decision awareness, from not recognized to recognized. Vertical axis: adequacy of decision grounds, from insufficient to sufficient. The top-left situation calls for noticing a decision. The bottom-left calls for noticing a decision and discovering missing grounds. The bottom-right calls for obtaining grounds, seeking input, or deferring a commitment. The top-right is a conditional stop point for targeted support when a person can proceed independently, not a separate active research theme. aCADemy, CAMeleon, and FuzzyCAD are colored project labels in their illustrative research situations. Positions are conceptual, not measured scores.</desc>
  <rect width="1000" height="770" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#202830">
    <text x="500" y="42" font-size="30" font-weight="700" text-anchor="middle">Design Decision Support Space</text>
    <text x="500" y="70" font-size="16" fill="#62707c" text-anchor="middle">One decision · One person or team · One moment</text>
    <path d="M98 385 H900 M500 140 V648" fill="none" stroke="#5c6872" stroke-width="1.8"/>
    <path d="M98 385 l11 -6 v12 z M900 385 l-11 -6 v12 z M500 140 l-6 11 h12 z M500 648 l-6 -11 h12 z" fill="#5c6872"/>
    <g fill="#556370" font-size="14" font-weight="700" letter-spacing="1">
      <text x="122" y="176">NOT RECOGNIZED · SUFFICIENT</text>
      <text x="530" y="176">RECOGNIZED · SUFFICIENT</text>
      <text x="122" y="426">NOT RECOGNIZED · INSUFFICIENT</text>
      <text x="530" y="426">RECOGNIZED · INSUFFICIENT</text>
    </g>
    <g font-size="25" font-weight="700">
      <text x="122" y="220">Discover the decision</text>
      <text x="530" y="220">Stop targeted support</text>
      <text x="122" y="470">Surface decision + gaps</text>
      <text x="530" y="470">Gather grounds or defer</text>
    </g>
    <g font-size="17" fill="#51606c">
      <text x="122" y="257">The relevant grounds are available;</text>
      <text x="122" y="281">the decision has not been noticed.</text>
      <text x="530" y="257">If the designer can proceed independently,</text>
      <text x="530" y="281">the tool steps back.</text>
      <text x="122" y="507">Neither the decision nor its missing</text>
      <text x="122" y="531">grounds have been recognized.</text>
      <text x="530" y="507">The decision is known, but more grounds</text>
      <text x="530" y="531">or contributions are needed.</text>
    </g>
    <rect x="530" y="298" width="210" height="31" rx="15" fill="none" stroke="#9ca7b0" stroke-width="1.2"/>
    <text x="635" y="319" text-anchor="middle" fill="#66727c" font-size="14" font-weight="700">NO ACTIVE TOOL TASK</text>
    <g font-size="16" font-weight="700">
      <rect x="122" y="557" width="115" height="35" rx="17" fill="#d6ebfc" stroke="#95bfdf"/>
      <text x="179" y="580" text-anchor="middle" fill="#255b89">aCADemy</text>
      <rect x="530" y="557" width="130" height="35" rx="17" fill="#fff0cc" stroke="#e2c681"/>
      <text x="595" y="580" text-anchor="middle" fill="#845d11">CAMeleon</text>
      <rect x="671" y="557" width="126" height="35" rx="17" fill="#fde5e9" stroke="#e0afb8"/>
      <text x="734" y="580" text-anchor="middle" fill="#9d3e50">FuzzyCAD</text>
    </g>
    <g font-size="18" font-weight="700">
      <text x="500" y="126" text-anchor="middle">Sufficient grounds</text>
      <text x="500" y="676" text-anchor="middle">Insufficient grounds</text>
      <text x="98" y="376" text-anchor="start">Not recognized</text>
      <text x="900" y="376" text-anchor="end">Recognized</text>
    </g>
    <g font-size="15" fill="#596672" text-anchor="middle">
      <text x="500" y="704">Y · Adequacy of decision grounds</text>
      <text x="500" y="726">X · Decision awareness</text>
      <text x="500" y="754">Colored markers indicate project focus, not scores or measured outcomes.</text>
    </g>
  </g>
</svg>
