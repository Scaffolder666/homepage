<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">Contextual inspection view schematic</title><desc id="d">The same three-dimensional assembly remains visible while a user selects a task context and examines relevant information. Explanatory diagram, not a Figma screenshot.</desc><rect width="960" height="460" rx="12" fill="#f5f6f7"/><rect x="20" y="20" width="920" height="420" rx="10" fill="white" stroke="#d9dee2"/><rect x="20" y="20" width="920" height="42" rx="10" fill="#282e34"/><rect x="20" y="49" width="920" height="13" fill="#282e34"/><text x="42" y="46" font-family="Arial,sans-serif" fill="white" font-size="14">Shared model · contextual view</text><text x="788" y="46" font-family="Arial,sans-serif" fill="white" font-size="14">INTERACTION SCHEMATIC</text><rect x="42" y="84" width="125" height="325" rx="7" fill="#fbfbfa" stroke="#e0e3e5"/><text x="59" y="114" font-family="Arial,sans-serif" font-size="15" fill="#424a51" font-weight="bold">View as</text><rect x="54" y="129" width="101" height="34" rx="5" fill="white" stroke="#d6dce0"/><text x="69" y="150" font-family="Arial,sans-serif" font-size="13" fill="#546068">Design</text><rect x="54" y="172" width="101" height="34" rx="5" fill="#b32632"/><text x="69" y="194" font-family="Arial,sans-serif" font-size="13" fill="white" font-weight="bold">Engineer</text><rect x="54" y="215" width="101" height="34" rx="5" fill="white" stroke="#d6dce0"/><text x="69" y="237" font-family="Arial,sans-serif" font-size="13" fill="#546068">PT</text><rect x="54" y="258" width="101" height="34" rx="5" fill="white" stroke="#d6dce0"/><text x="69" y="280" font-family="Arial,sans-serif" font-size="13" fill="#546068">Fabricate</text><path d="M61 322 h9 l8 10 l15 -19" fill="none" stroke="#2f7e68" stroke-width="3"/><text x="59" y="352" font-family="Arial,sans-serif" font-size="12" fill="#536069">Switch freely</text><text x="59" y="371" font-family="Arial,sans-