<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">Layer-mask interaction schematic</title><desc id="d">A design region is masked for a local change while the surrounding design remains visible. This is an explanatory diagram, not a Photoshop screenshot.</desc><rect width="960" height="460" rx="12" fill="#f5f6f7"/><rect x="20" y="20" width="920" height="420" rx="10" fill="white" stroke="#d9dee2"/><rect x="20" y="20" width="920" height="42" rx="10" fill="#282e34"/><rect x="20" y="49" width="920" height="13" fill="#282e34"/><g fill="white" font-family="Arial,sans-serif" font-size="14"><text x="42" y="46">Local editing · mask</text><text x="788" y="46">INTERACTION SCHEMATIC</text></g><rect x="42" y="84" width="640" height="326" rx="8" fill="#fbfbfa" stroke="#e1e4e7"/><rect x="704" y="84" width="214" height="326" rx="8" fill="#fbfbfa" stroke="#e1e4e7"/><text x="65" y="116" fill="#353c42" font-family="Arial,sans-serif" font-size="18" font-weight="bold">Keep the whole design in view</text><text x="724" y="115" fill="#353c42" font-family="Arial,sans-serif" font-size="16" font-weight="bold">Layer + mask</text><g stroke="#8d989f" stroke-width="3" stroke-linejoin="round"><path d="M118 266 L202 218 L300 262 L213 312 Z" fill="#f3f6f7"/><path d="M118 266 L118 327 L213 374 L213 312 Z" fill="#e9edee"/><path d="M213 312 L300 262 L300 320 L213 374 Z" fill="#dfe5e7"/><path d="M298 265 L396 216 L488 258 L388 308 Z" fill="#f3f6f7"/><path d="M298 265 L298 325 L388 368 L388 308 Z" fill="#e9edee"/><path d="M388 308 L488 258 L488 320 L388 368 Z" fill="#dfe5e7"/></g><path d="M315 250 L391 212 L472 251 L391 291 Z" fill="#b32632" fill-opacity=".15" stroke="#b32632" stroke-width="3" stroke-dasharray="7 5"/><path d="M315 250 L315 320 L391 355 L391 291 M391 355 L472 312 L472 251" fill="none" stroke="#b32632" stroke-width="3" stroke-dasharray="7 5"/><path d="M471 276 L548 224" stroke="#b32632" stroke-width="2" fill="none"/><rect x="525" y="173" width="140" height="54" rx="6" fill="white" stroke="#b32632"/><text x="537" y="194" font-family="Arial,sans-serif" font-size="14" fill="#b32632" font-weight="bold">Change region</text><text x="537" y="211" font-family="Arial,sans-serif" font-size="12" fill="#4b535a">Editable scope</text><text x="66" y="398" font-family="Arial,sans-serif" font-size="13" fill="#64717b">Outside geometry remains visible for context</text><rect x="724" y="137" width="174" height="54" rx="5" fill="white" stroke="#d5dadf"/><rect x="736" y="148" width="29" height="29" rx="3" fill="#dfe5e7"/><rect x="773" y="148" width="29" height="29" rx="3" fill="white" stroke="#aab3b9"/><rect x="778" y="153" width="19" height="19" rx="2" fill="#222"/><rect x="783" y="158" width="10" height="10" fill="#fff"/><text x="810" y="157" font-family="Arial,sans-serif" fill="#39424a" font-size="12">Edit layer</text><text x="810" y="173" font-family="Arial,sans-serif" fill="#67737b" font-size="11">Mask selected</text><rect x="724" y="209" width="174" height="48" rx="5" fill="#fbf0f1" stroke="#e4b5b9"/><text x="738" y="230" font-family="Arial,sans-serif" font-size="13" fill="#93202a" font-weight="bold">Only edit inside</text><text x="738" y="246" font-family="Arial,sans-serif" font-size="11" fill="#93202a">the chosen area</text><rect x="724" y="277" width="174" height="48" rx="5" fill="white" stroke="#d5dadf"/><text x="738" y="298" font-family="Arial,sans-serif" font-size="13" fill="#3f4950">Review the result</text><text x="738" y="313" font-family="Arial,sans-serif" font-size="11" fill="#6e7880">before applying</text><text x="724" y="386" font-family="Arial,sans-serif" font-size="11" fill="#7a838b">Conceptual CAD transfer</text></svg>